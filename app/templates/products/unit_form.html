{% extends "base.html" %}
{% block page_title %}{% if unit %}Edit Unit{% else %}New Unit{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
<div class="form-card">
  <h5 class="fw-semibold mb-4">{% if unit %}Edit Unit{% else %}New Unit{% endif %}</h5>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" value="{{ unit.name if unit else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Symbol *</label><input type="text" name="symbol" class="form-control" value="{{ unit.symbol if unit else '' }}" required></div>
    {% if unit %}<div class="mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" value="1" {% if unit.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div></div>{% endif %}
    <div class="d-flex gap-2"><button class="btn btn-primary">Save</button><a href="{{ url_for('products.units') }}" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div></div></div>
{% endblock %}
