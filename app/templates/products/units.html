{% extends "base.html" %}
{% block page_title %}Units of Measure{% endblock %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <span class="text-muted">{{ units | length }} units</span>
  <a href="{{ url_for('products.new_unit') }}" class="btn btn-sm btn-primary"><i class="bi bi-plus-lg me-1"></i>New Unit</a>
</div>
<div class="table-card">
  <table class="table table-hover mb-0">
    <thead><tr><th>Name</th><th>Symbol</th><th class="text-center">Status</th><th></th></tr></thead>
    <tbody>{% for u in units %}<tr><td>{{ u.name }}</td><td class="fw-mono">{{ u.symbol }}</td><td class="text-center">{% if u.is_active %}<span class="badge bg-success-subtle text-success">Active</span>{% else %}<span class="badge bg-secondary-subtle text-secondary">Inactive</span>{% endif %}</td><td><a href="{{ url_for('products.edit_unit', id=u.id) }}" class="btn btn-sm btn-outline-primary py-0">Edit</a></td></tr>{% endfor %}</tbody>
  </table>
</div>
{% endblock %}
