{% extends "base.html" %}
{% block page_title %}Record Loss / Damage{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="form-card">
  <h5 class="fw-semibold mb-4"><i class="bi bi-exclamation-octagon me-2 text-danger"></i>Record Loss / Damage / Expiry</h5>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Product *</label>
      <select name="product_id" class="form-select" required>
        <option value="">Select product…</option>
        {% for p in products %}<option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.current_stock }})</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Loss Type *</label>
      <select name="movement_type" class="form-select" required>
        <option value="DAMAGE">Damage</option>
        <option value="EXPIRY">Expiry</option>
        <option value="LOSS">Loss / Theft</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Quantity *</label>
      <input type="number" name="quantity" class="form-control" min="1" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Reason *</label>
      <textarea name="reason" class="form-control" rows="3" required placeholder="Describe what happened…"></textarea>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-danger">Record Loss</button>
      <a href="{{ url_for('inventory.index') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div></div></div>
{% endblock %}
