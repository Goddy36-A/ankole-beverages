{% extends "base.html" %}
{% block page_title %}Request Stock Adjustment{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="form-card">
  <h5 class="fw-semibold mb-4"><i class="bi bi-sliders me-2 text-warning"></i>Request Stock Adjustment</h5>
  <p class="text-muted small mb-4">All adjustments require manager approval before stock is updated.</p>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Product *</label>
      <select name="product_id" class="form-select" required>
        <option value="">Select product…</option>
        {% for p in products %}<option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.current_stock }})</option>{% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Adjustment Type *</label>
      <select name="adjustment_type" class="form-select" required>
        <option value="IN">IN — Increase Stock</option>
        <option value="OUT">OUT — Decrease Stock</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Quantity *</label>
      <input type="number" name="quantity" class="form-control" min="1" required>
    </div>
    <div class="mb-4">
      <label class="form-label">Reason * <span class="text-muted small">(min 5 chars)</span></label>
      <textarea name="reason" class="form-control" rows="3" required placeholder="e.g. Physical count, data correction, damage, loss…"></textarea>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-warning">Submit for Approval</button>
      <a href="{{ url_for('inventory.adjustments') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div></div></div>
{% endblock %}
