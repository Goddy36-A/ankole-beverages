{% extends "base.html" %}
{% block page_title %}{% if customer %}Edit Customer{% else %}New Customer{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="form-card">
  <h5 class="fw-semibold mb-4">{% if customer %}Edit Customer{% else %}New Customer{% endif %}</h5>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-12"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" value="{{ customer.name if customer else '' }}" required></div>
      <div class="col-md-6"><label class="form-label">Customer Type</label>
        <select name="customer_type" class="form-select">
          {% for t in ["Walk-in","Retailer","Wholesaler","Distributor","Business"] %}
          <option {% if customer and customer.customer_type == t %}selected{% endif %}>{{ t }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6"><label class="form-label">Phone</label><input type="text" name="telephone" class="form-control" value="{{ customer.telephone or '' if customer else '' }}"></div>
      <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ customer.email or '' if customer else '' }}"></div>
      <div class="col-md-6"><label class="form-label">Credit Limit (UGX)</label><input type="number" name="credit_limit" class="form-control" value="{{ customer.credit_limit if customer else 0 }}" min="0"></div>
      <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2">{{ customer.address or '' if customer else '' }}</textarea></div>
      <div class="col-md-6"><label class="form-label">Payment Terms</label><input type="text" name="payment_terms" class="form-control" value="{{ customer.payment_terms or '' if customer else '' }}" placeholder="e.g. Net 30"></div>
      {% if customer %}<div class="col-md-6 d-flex align-items-end"><div class="form-check mb-2"><input class="form-check-input" type="checkbox" name="is_active" value="1" {% if customer.is_active %}checked{% endif %}><label class="form-check-label">Active</label></div></div>{% endif %}
    </div>
    <div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save</button><a href="{{ url_for('customers.index') }}" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div></div></div>
{% endblock %}
