{% extends "base.html" %}
{% block page_title %}Record Payment{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="form-card">
  <h5 class="fw-semibold mb-2">Record Payment</h5>
  <p class="text-muted small mb-4">Invoice: <strong>{{ sale.invoice_number }}</strong> — Outstanding: <strong class="text-danger">{{ sale.balance | ugx }}</strong></p>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Amount (UGX) *</label><input type="number" name="amount" class="form-control" value="{{ sale.balance }}" min="1" max="{{ sale.balance }}" required></div>
    <div class="mb-3"><label class="form-label">Payment Method *</label>
      <select name="payment_method_id" class="form-select" required><option value="">Select…</option>{% for m in methods %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label class="form-label">Reference Number</label><input type="text" name="reference_number" class="form-control" placeholder="Mobile money ref, cheque #, etc."></div>
    <div class="mb-4"><label class="form-label">Notes</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    <div class="d-flex gap-2"><button class="btn btn-success">Record Payment</button><a href="{{ url_for('sales.detail', id=sale.id) }}" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div></div></div>
{% endblock %}
