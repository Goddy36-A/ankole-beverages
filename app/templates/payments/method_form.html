{% extends "base.html" %}

{% block breadcrumb %}<li class="breadcrumb-item"><a href="{{ url_for('payments.methods') }}">Payment Methods</a></li><li class="breadcrumb-item active">New Method</li>{% endblock %}

{% block page_title %}New Payment Method{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
<div class="form-card">
  <h5 class="fw-semibold mb-4">New Payment Method</h5>
  <form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Name *</label><input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
    <div class="d-flex gap-2"><button class="btn btn-primary">Save</button><a href="{{ url_for('payments.methods') }}" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div></div></div>
{% endblock %}
