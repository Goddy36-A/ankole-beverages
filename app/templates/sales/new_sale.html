{% extends "base.html" %}
{% block page_title %}New Sale{% endblock %}
{% block extra_css %}
<style>
.line-row td { padding: 6px 8px; }
.line-row input { font-size:13px; }
</style>
{% endblock %}
{% block content %}
<form method="POST" id="saleForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-lg-8">
      <!-- Line items -->
      <div class="table-card mb-3">
        <div class="table-card-header">
          <i class="bi bi-cart3 me-2"></i>Sale Items
          <button type="button" class="btn btn-sm btn-outline-primary ms-auto" onclick="addLine()"><i class="bi bi-plus-lg me-1"></i>Add Product</button>
        </div>
        <div class="table-responsive">
          <table class="table mb-0" id="linesTable">
            <thead><tr><th style="width:35%">Product</th><th style="width:13%">Stock</th><th style="width:12%">Qty</th><th style="width:18%">Unit Price (UGX)</th><th style="width:16%">Line Total</th><th style="width:6%"></th></tr></thead>
            <tbody id="lineBody">
              <tr class="line-row" id="line-0">
                <td><select name="product_id[]" class="form-select form-select-sm" onchange="fillPrice(this,0)"><option value="">Select product…</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-stock="{{ p.current_stock }}" data-active="{{ p.is_active | lower }}">{{ p.name }} ({{ p.current_stock }} in stock)</option>{% endfor %}</select></td>
                <td><span class="stock-badge-0 text-muted small">—</span></td>
                <td><input type="number" name="quantity[]" class="form-control form-control-sm" min="1" value="1" oninput="calcLine(0)"></td>
                <td><input type="number" name="unit_price[]" class="form-control form-control-sm" min="0" value="0" oninput="calcLine(0)"></td>
                <td><span id="lt-0" class="fw-semibold small">UGX 0</span></td>
                <td><button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="removeLine(0)"><i class="bi bi-x"></i></button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- Totals -->
      <div class="form-card">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Discount (UGX)</label>
            <input type="number" name="discount" id="discount" class="form-control" value="0" min="0" oninput="calcGrand()">
          </div>
          <div class="col-md-4">
            <label class="form-label">Tax (UGX)</label>
            <input type="number" name="tax" id="tax" class="form-control" value="0" min="0" oninput="calcGrand()">
          </div>
          <div class="col-md-4">
            <label class="form-label">Grand Total</label>
            <div class="form-control bg-light fw-bold" id="grandTotal">UGX 0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="form-card mb-3">
        <h6 class="fw-semibold mb-3">Customer &amp; Payment</h6>
        <div class="mb-3">
          <label class="form-label">Customer *</label>
          <select name="customer_id" class="form-select" required>
            <option value="">Select customer…</option>
            {% for c in customers %}<option value="{{ c.id }}">{{ c.name }} ({{ c.customer_type }})</option>{% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Sale Type *</label>
          <select name="sale_type" class="form-select" id="saleType">
            <option value="CASH">Cash</option>
            <option value="CREDIT">Credit</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Amount Paid (UGX)</label>
          <input type="number" name="amount_paid" class="form-control" value="0" min="0">
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select name="payment_method_id" class="form-select">
            <option value="">— Select —</option>
            {% for m in methods %}<option value="{{ m.id }}">{{ m.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Payment Reference</label>
          <input type="text" name="payment_reference" class="form-control" placeholder="Mobile money ref, etc.">
        </div>
        <div class="mb-3">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg me-1"></i>Confirm Sale</button>
      </div>
    </div>
  </div>
</form>
{% endblock %}
{% block extra_js %}
<script>
const products = { {% for p in products %}{{ p.id }}: {price:{{ p.selling_price }}, stock:{{ p.current_stock }}, active:{{ p.is_active | lower }} },{% endfor %} };
let lineCount = 1;
let totals = {0: 0};

function fillPrice(sel, idx) {
  const pid = parseInt(sel.value);
  const row = document.getElementById('line-'+idx);
  if (!pid || !products[pid]) { row.querySelector('[id^="lt-"]').textContent = 'UGX 0'; totals[idx]=0; calcGrand(); return; }
  row.querySelectorAll('input')[1].value = products[pid].price;
  row.querySelector('.stock-badge-'+idx).textContent = products[pid].stock + ' in stock';
  calcLine(idx);
}
function calcLine(idx) {
  const row = document.getElementById('line-'+idx);
  if (!row) return;
  const inputs = row.querySelectorAll('input[type="number"]');
  const qty = parseInt(inputs[0].value) || 0;
  const price = parseInt(inputs[1].value) || 0;
  const lt = qty * price;
  totals[idx] = lt;
  document.getElementById('lt-'+idx).textContent = 'UGX ' + lt.toLocaleString();
  calcGrand();
}
function calcGrand() {
  const sub = Object.values(totals).reduce((a,b)=>a+b,0);
  const disc = parseInt(document.getElementById('discount').value)||0;
  const tax = parseInt(document.getElementById('tax').value)||0;
  const grand = sub - disc + tax;
  document.getElementById('grandTotal').textContent = 'UGX ' + grand.toLocaleString();
}
function addLine() {
  const idx = lineCount++;
  totals[idx] = 0;
  const tbody = document.getElementById('lineBody');
  const tr = document.createElement('tr');
  tr.className = 'line-row'; tr.id = 'line-'+idx;
  tr.innerHTML = `<td><select name="product_id[]" class="form-select form-select-sm" onchange="fillPrice(this,${idx})"><option value="">Select product…</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.selling_price }}" data-stock="{{ p.current_stock }}">{{ p.name }} ({{ p.current_stock }} in stock)</option>{% endfor %}</select></td><td><span class="stock-badge-${idx} text-muted small">—</span></td><td><input type="number" name="quantity[]" class="form-control form-control-sm" min="1" value="1" oninput="calcLine(${idx})"></td><td><input type="number" name="unit_price[]" class="form-control form-control-sm" min="0" value="0" oninput="calcLine(${idx})"></td><td><span id="lt-${idx}" class="fw-semibold small">UGX 0</span></td><td><button type="button" class="btn btn-sm btn-outline-danger py-0" onclick="removeLine(${idx})"><i class="bi bi-x"></i></button></td>`;
  tbody.appendChild(tr);
}
function removeLine(idx) {
  const row = document.getElementById('line-'+idx);
  if (row && document.getElementById('lineBody').children.length > 1) { row.remove(); delete totals[idx]; calcGrand(); }
}
</script>
{% endblock %}
