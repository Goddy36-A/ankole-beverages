{% extends "base.html" %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-muted mb-3"><i class="bi bi-shield-lock"></i></div>
  <h2 class="fw-bold mb-2">403 — Access Denied</h2>
  <p class="text-muted mb-4">You do not have permission to access this page.</p>
  <a href="{% if current_user.is_authenticated %}{{ url_for('dashboard.index') }}{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
