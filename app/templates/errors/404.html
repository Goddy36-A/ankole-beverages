{% extends "base.html" %}
{% block page_title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-muted mb-3"><i class="bi bi-map"></i></div>
  <h2 class="fw-bold mb-2">404 — Page Not Found</h2>
  <p class="text-muted mb-4">The page you are looking for does not exist.</p>
  <a href="{% if current_user.is_authenticated %}{{ url_for('dashboard.index') }}{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
