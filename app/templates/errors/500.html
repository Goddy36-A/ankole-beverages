{% extends "base.html" %}
{% block page_title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 text-muted mb-3"><i class="bi bi-exclamation-octagon"></i></div>
  <h2 class="fw-bold mb-2">500 — Server Error</h2>
  <p class="text-muted mb-4">Something went wrong on our end. Please try again.</p>
  <a href="{% if current_user.is_authenticated %}{{ url_for('dashboard.index') }}{% else %}{{ url_for('auth.login') }}{% endif %}" class="btn btn-primary">Go Home</a>
</div>
{% endblock %}
