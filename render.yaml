services:
  - type: web
    name: ankole-beverages
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120

    healthCheckPath: /auth/login

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ankole-db
          property: connectionString

      - key: CURRENCY
        value: UGX

databases:
  - name: ankole-db
    databaseName: ankole_beverages
    user: ankole_user
    plan: free
    region: oregon
