services:
  - type: web
    name: ankole-beverages
    runtime: python
    region: oregon           # closest to Uganda with free tier
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 2 --timeout 120
    healthCheckPath: /auth/login

    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value

      - key: DATABASE_URL
        fromDatabase:
          name: ankole-db
          property: connectionString

      - key: CURRENCY
        value: UGX

databases:
  - name: ankole-db
    databaseName: ankole_beverages
    user: ankole_user
    plan: free
    region: oregon
